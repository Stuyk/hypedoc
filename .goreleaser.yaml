# Driven by .github/workflows/release.yml. The version comes from version.txt
# (embedded into the binary) and the matching v<version> tag the workflow creates.
version: 2
project_name: hypedoc
builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^chore:", "^test:"]
