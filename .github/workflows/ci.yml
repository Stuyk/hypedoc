name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate version.txt
        run: |
          v="$(tr -d '[:space:]' < version.txt)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error file=version.txt::must be semver (X.Y.Z), got '$v'"; exit 1; }
      - run: make test
      - run: make smoke
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
