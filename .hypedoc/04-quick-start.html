<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quick start: hypedoc init, then hypedoc build</title>
<meta name="hypedoc:width" content="960">
<style>
  :root { --paper: #f3efe6; --ink: #4a2f3a; --muted: #5e4651; --cyan: #44adcb; --stone: #ddd8ce; --chalk: #fbf9f4; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 16px 8px; font-family: Inter, Arimo, ui-sans-serif, system-ui, sans-serif; color: var(--ink); }
  .wrap { position: relative; }
  .term { border: 3px solid var(--ink); border-radius: 12px; box-shadow: 6px 6px 0 var(--ink); overflow: hidden; background: var(--chalk); }
  .bar { display: flex; align-items: center; gap: 8px; background: var(--paper); border-bottom: 3px solid var(--ink); padding: 12px 16px; }
  .bar i { width: 13px; height: 13px; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--chalk); }
  .bar i:first-child { background: var(--cyan); }
  .bar span { margin-left: 10px; font: 800 12.5px/1 Arimo, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  pre { margin: 0; padding: 24px 28px 26px; font: 600 16.5px/1.8 "JetBrains Mono", "DejaVu Sans Mono", monospace; color: var(--ink); }
  .p { color: var(--cyan); font-weight: 800; } .c { font-weight: 800; }
  .dim { color: #8a7480; }
  .hi { background: var(--cyan); border: 2px solid var(--ink); border-radius: 5px; padding: 1px 7px; font-weight: 800; box-shadow: 2px 2px 0 var(--ink); }
  .sticker { position: absolute; right: 30px; top: -12px; transform: rotate(3deg); background: var(--stone);
    border: 3px solid var(--ink); border-radius: 9px; box-shadow: 4px 4px 0 var(--ink); padding: 10px 14px;
    font: 800 12.5px/1.2 Arimo, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  .sticker code { display: block; margin-top: 6px; font: 800 15px "JetBrains Mono", "DejaVu Sans Mono", monospace; letter-spacing: 0; text-transform: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="term">
      <div class="bar"><i></i><i></i><i></i><span>Quick start</span></div>
<pre><span class="p">$</span> <span class="c">hypedoc init</span>
created .hypedoc/01-hero.html
<span class="dim"># design it in HTML (or let your agent do it)</span>

<span class="p">$</span> <span class="c">hypedoc build</span>
rendered .hypedoc/img/01-hero.png <span class="dim">(light, 960x474)</span>
<span class="hi">updated README.md (1 graphics)</span></pre>
    </div>
    <div class="sticker">Agent tip<code>hypedoc guide</code></div>
  </div>
</body>
</html>
