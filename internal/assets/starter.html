<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<meta name="hypedoc:width" content="960">
<style>
  :root { --bg: #ffffff; --fg: #0b0d12; --muted: #5b6475; --accent: #6d5dfc; --line: #e4e7ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9aa4b2; --accent: #8b7dff; --line: #262c36; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
  .card { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 20px; padding: 56px; }
  h1 { margin: 0 0 12px; font-size: 52px; letter-spacing: -0.03em; }
  h1 span { color: var(--accent); }
  p { margin: 0; font-size: 20px; color: var(--muted); max-width: 640px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <h1><span>{{TITLE}}</span></h1>
    <p>Describe what this project does in one sentence. Replace this file with your own design.</p>
  </div>
</body>
</html>
